name: Release

# **タグを打ったときと、手動で起動したときだけ**動く。
# main への push では publish しない（意図せず版が出るのを防ぐ）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '実際には publish せず、内容だけ確認する'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # GitHub Packages への publish に必要
      packages: write

    outputs:
      # canary へ渡す。タグ名ではなく **package.json の値**を正とする
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # registry-url を渡すと ~/.npmrc に authToken の行が書かれる。
      # スコープを指定しないと npmjs.com 側を見にいってしまう。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kedama-design'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # publish 前に CI と同じ門を通す。タグを打った時点のコードが
      # main と同一とは限らないため、ここでも実行する。
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # publish する版は **package.json を正**とする。canary へもこの値を渡す
      # （タグ名や workflow_run の ref からは導かない）。
      # 判定は semver.org 公式の ECMAScript 互換式（canary 側と同一）。
      # `grep -E` へ移植した近似式は不正な pre-release / build metadata を通す。
      - name: Read the version from package.json
        id: version
        run: |
          node -e '
            const fs = require("node:fs");
            const RE = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;
            const v = require("./package.json").version ?? "";
            if (!RE.test(v)) {
              console.log(`::error::package.json の version が SemVer ではありません: ${v}`);
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${v}\n`);
            console.log(`publish 対象: ${v}`);
          '

      # タグ名と package.json の version が食い違ったまま publish すると、
      # 後から「どのコードが入っているか」を追えなくなる。
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PKG: ${{ steps.version.outputs.value }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::タグ v$TAG と package.json の $PKG が一致しません"
            exit 1
          fi

      # 何が同梱されるかを毎回ログに残す。files: ["dist"] の取りこぼしは
      # 消費側でしか気づけないため、publish の記録として出しておく。
      - name: Show the package contents
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/*.tgz | sort

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: pnpm publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skipped (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "dry_run=true のため publish していません。上の一覧で内容を確認してください。"

  # **実際に publish したときだけ**消費側検証を走らせる。
  # dry-run では公開されていないので呼ばない（workflow_run にすると
  # dry-run の成功でも発火してしまい、未公開の版を探しにいって落ちる）。
  canary:
    name: Canary
    needs: publish
    if: github.event_name == 'push' || inputs.dry_run == false
    uses: ./.github/workflows/canary.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    permissions:
      contents: read
      packages: read
