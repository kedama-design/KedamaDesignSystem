name: Release

# **タグを打ったときと、手動で起動したときだけ**動く。
# main への push では publish しない（意図せず版が出るのを防ぐ）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '実際には publish せず、内容だけ確認する'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # GitHub Packages への publish に必要
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # registry-url を渡すと ~/.npmrc に authToken の行が書かれる。
      # スコープを指定しないと npmjs.com 側を見にいってしまう。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kedama-design'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # publish 前に CI と同じ門を通す。タグを打った時点のコードが
      # main と同一とは限らないため、ここでも実行する。
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # タグ名と package.json の version が食い違ったまま publish すると、
      # 後から「どのコードが入っているか」を追えなくなる。
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::タグ v$TAG と package.json の $PKG が一致しません"
            exit 1
          fi

      # 何が同梱されるかを毎回ログに残す。files: ["dist"] の取りこぼしは
      # 消費側でしか気づけないため、publish の記録として出しておく。
      - name: Show the package contents
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/*.tgz | sort

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: pnpm publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skipped (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "dry_run=true のため publish していません。上の一覧で内容を確認してください。"
