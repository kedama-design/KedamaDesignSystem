name: Canary

# **公開済みパッケージを、消費側の立場で新規導入して確かめる。**
#
# CI のビルドが通ることと、消費側が実際に入れて使えることは別問題である。
# exports の書き漏らし・files の取りこぼし・peer の不足は、リポジトリの中では
# 気づけない（ソースが手元にあるので解決してしまう）。
# ここでは GitHub Packages から**完全固定のバージョン**を入れ直す。
#
# ## 起動経路
#
# `workflow_run` は使わない。あれは Release が **dry-run で成功した場合にも**発火し、
# 公開されていないのに canary が走ってしまう。加えて `workflow_run` の ref は
# 既定ブランチになる仕様で、`head_branch` から公開バージョンを導けない。
# **実際に publish した Release から version を明示的に渡す**形にする。
on:
  workflow_call:
    inputs:
      version:
        description: '検証するバージョン（完全固定。例 0.1.0）'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: '検証するバージョン（完全固定。例 0.1.0）'
        type: string
        required: true

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  install-and-build:
    name: Install from GitHub Packages and build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # GitHub Packages からの読み取りに必要
      packages: read

    steps:
      # 消費側を模すので、このリポジトリのソースは使わない。
      # チェックアウトするのは検証用プロジェクトの雛形だけ。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/consumer-check
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          registry-url: https://npm.pkg.github.com
          scope: '@kedama-design'

      # 呼び出し元から渡された値をそのまま使う。SemVer として妥当かだけ確かめる
      # （不正な値のまま install させると、失敗の原因が分かりにくくなる）。
      #
      # 判定は **semver.org 公式の ECMAScript 互換式**を Node の RegExp で行う。
      # `grep -E` へ移植してはいけない。公式式は `(?:...)` を使っており、それを
      # 外した近似式は不正な pre-release / build metadata を通してしまう
      # （`1.0.0-01` / `1.0.0-a..b` / `1.0.0-a.` / `1.0.0+build..5` を実測で確認）。
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const RE = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;
            const v = process.env.VERSION ?? "";
            if (!RE.test(v)) {
              console.log(`::error::SemVer として不正なバージョンです: ${v}`);
              process.exit(1);
            }
            console.log(`検証対象: @kedama-design/design-system@${v}`);
          '

      - name: Install the published package
        working-directory: .github/consumer-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # --save-exact で完全固定。範囲指定だと別の版が入りうる
          npm install --save-exact "@kedama-design/design-system@$VERSION" \
            react@19 react-dom@19 vite@6 typescript@5 @types/react@19 \
            --no-audit --no-fund

      # `require('@kedama-design/design-system/package.json')` は使えない。
      # package.json は exports に無いため ERR_PACKAGE_PATH_NOT_EXPORTED になる
      # （実測で確認）。**確認のために公開面を増やさない**。実ファイルを直接読む。
      - name: Verify the installed version is exactly what we asked for
        working-directory: .github/consumer-check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          INSTALLED="$(node -p "require('./node_modules/@kedama-design/design-system/package.json').version")"
          echo "installed=$INSTALLED expected=$VERSION"
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::入った版 $INSTALLED が指定した $VERSION と違います"
            exit 1
          fi
          # どこから解決されたかを記録に残す（レジストリ経由であることの証跡）
          npm ls @kedama-design/design-system --json

      # root / /tokens / /styles の3つを消費側の視点で使う
      - name: Typecheck
        working-directory: .github/consumer-check
        run: npx tsc --noEmit

      - name: Build
        working-directory: .github/consumer-check
        run: npx vite build
